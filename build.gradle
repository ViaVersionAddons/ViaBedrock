plugins {
    id "java-library"
    id "base.base-conventions"
    id "viabedrock.checkstyle"
    id "base.fill-build-constants"
    id "viabedrock.publishing-conventions"
    id "via.run-with-viaproxy-task"
    id "net.raphimc.class-token-replacer" version "1.1.7"
}

checkstyleMain {
    exclude("**/generated/**")
}

sourceSets {
    tool

    tool.compileClasspath += main.output + main.compileClasspath
    tool.runtimeClasspath += tool.compileClasspath
}

repositories {
    //mavenLocal() // Uncomment when updating
    maven {
        name = "ViaVersion"
        url = "https://repo.viaversion.com"

        content {
            includeGroupByRegex "com\\.viaversion(\\..+)?"
            includeGroupByRegex "net\\.raphimc(\\..+)?"
        }
    }
    maven {
        name = "OpenCollab Snapshots"
        url = "https://repo.opencollab.dev/maven-snapshots"

        content {
            includeGroupByRegex "org\\.cloudburstmc\\..+"
            includeGroup "dev.opencollab"
        }
    }
    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net"

        content {
            includeGroup "com.mojang"
        }
    }
    maven {
        name = "Jitpack"
        url = "https://jitpack.io"

        content {
            includeGroupByRegex "com\\.github\\..+"
        }
    }
}

dependencies {
    compileOnly "com.viaversion:viaversion-common:5.12.0"
    compileOnly "org.yaml:snakeyaml:2.7"
    compileOnly "com.google.guava:guava:33.7.1-jre"
    compileOnly "io.netty:netty-handler:4.2.18.Final"
    compileOnly "com.google.code.gson:gson:2.14.0"
    compileOnly "org.cloudburstmc.netty:netty-transport-raknet:2.0.0.CR4-20260921.144528-1"
    compileOnly "org.cloudburstmc.netty:netty-transport-nethernet:2.0.0.CR4-20260921.144528-1"

    api("io.netty:netty-codec-http:4.2.18.Final") {
        transitive = false
    }
    api("io.netty:netty-codec-compression:4.2.18.Final") {
        transitive = false
    }
    api "io.jsonwebtoken:jjwt-impl:0.13.0"
    api("io.jsonwebtoken:jjwt-gson:0.13.0") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    api("net.lenni0451.mcstructs-bedrock:text:2.0.1") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    api("net.lenni0451.mcstructs-bedrock:forms:2.0.1") {
        exclude group: "com.google.code.gson", module: "gson"
    }
    api("com.viaversion.mcstructs:dialog:5-3.2.2-20251210.004302-1") {
        exclude group: "com.viaversion.mcstructs", module: "core"
        exclude group: "com.viaversion.mcstructs", module: "text"
        exclude group: "com.viaversion.mcstructs", module: "snbt"
        exclude group: "com.viaversion.mcstructs", module: "converter"
    }
    api "com.vdurmont:semver4j:3.1.0"
    api "com.mojang:brigadier:1.3.10"
    api "at.yawk.lz4:lz4-java:1.12.0"
    api("com.github.oryxel1:CubeConverter:abecffaaea") {
        transitive = false
    }
    api("team.unnamed:mocha:3.0.1") {
        transitive = false
    }

    toolImplementation "org.jsoup:jsoup:1.23.2"
    toolImplementation "org.ow2.asm:asm-tree:9.10.1"
    toolImplementation "net.lenni0451.commons:asm:1.9.2"
}

def registerToolTask(String name, String toolMainClass, String toolDescription) {
    tasks.register(name, JavaExec) {
        group = "viabedrock tools"
        description = toolDescription
        mainClass = toolMainClass
        classpath = sourceSets.tool.runtimeClasspath
        workingDir = rootDir
    }
}

registerToolTask("generateJavaDataEnums", "net.raphimc.viabedrock.tool.generator.JavaDataEnumGenerator",
    "Generates the java edition data enums from the vanilla client jar. Options: --version, --client-jar")
registerToolTask("generateBedrockDataEnums", "net.raphimc.viabedrock.tool.generator.BedrockDataEnumGenerator",
    "Generates the bedrock edition data enums from a protocol-docs clone. Options: --protocol-docs")
registerToolTask("generateMappingData", "net.raphimc.viabedrock.tool.generator.MappingDataGenerator",
    "Generates the mapping constant classes from the loaded mapping data")
registerToolTask("generateBedrockPacks", "net.raphimc.viabedrock.tool.generator.client.BedrockPacksGenerator",
    "Generates the bundled vanilla resource packs and skin packs from the bedrock client. Options: --client-data")
registerToolTask("generateBedrockSoundLists", "net.raphimc.viabedrock.tool.generator.client.BedrockSoundListGenerator",
    "Generates sounds.json, block_sounds.json and level_sound_event_mappings.json from the bedrock client. Options: --client-data")
registerToolTask("generateBedrockParticleList", "net.raphimc.viabedrock.tool.generator.client.BedrockParticleListGenerator",
    "Generates particles.json from the bedrock client. Options: --client-data")
registerToolTask("reportMappingGaps", "net.raphimc.viabedrock.tool.mapping.MappingGapReporter",
    "Reports missing or broken mappings, derived block tags and potted states. Options: --category, --limit")
registerToolTask("syncDerivedMappings", "net.raphimc.viabedrock.tool.mapping.DerivedMappingDataUpdater",
    "Adds block tags and potted states derived from the current Bedrock and Java data")
registerToolTask("reportMappingMistakes", "net.raphimc.viabedrock.tool.mapping.MappingMistakeReporter",
    "Reports mappings which load fine but disagree with the rest of the data. Options: --limit")
registerToolTask("proposeMappings", "net.raphimc.viabedrock.tool.mapping.MappingProposer",
    "Writes mapping proposals for every gap to run/mapping-proposals. Options: --min-score")
registerToolTask("applyMappingProposals", "net.raphimc.viabedrock.tool.mapping.MappingProposalApplier",
    "Applies reviewed proposals back into the data assets. Options: --category, --keep-stale, --replace, --dry-run")
registerToolTask("selfTestMappings", "net.raphimc.viabedrock.tool.mapping.MappingSelfTest",
    "Hides the mappings of each already mapped block and checks whether the proposer reproduces them. Options: --limit, --show")
registerToolTask("validateMappings", "net.raphimc.viabedrock.tool.mapping.MappingValidator",
    "Loads the mapping data the way a real connection does, which fails if anything is still missing or broken")
registerToolTask("upgradeBlockStateMappings", "net.raphimc.viabedrock.tool.BlockStateMappingsUpgrader",
    "Upgrades blockstate_mappings.json through block state upgrade schemas. Options: --schema, --from, --mappings, --output")
registerToolTask("sortJson", "net.raphimc.viabedrock.tool.JsonSorter",
    "Sorts data asset json files in place. Options: --file (required), --deep")
registerToolTask("convertResourcePack", "net.raphimc.viabedrock.test.ResourcePackConverterTest",
    "Converts a bedrock .mcpack to a java resource pack. Options: --input (required), --output")
